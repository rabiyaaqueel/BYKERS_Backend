# ==============================================================================
# Docker Compose for Optional Local Development
# ==============================================================================
version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bykers_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bykers_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bykers_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/gis_database
      SECRET_KEY: local-dev-secret-key-at-least-32-chars-long
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

